# ==========================================
# Kitty — Alpine Autumn
# Theme: Mountain Village / Autumn Forest
# ==========================================

# Font
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.0

# General
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 12
hide_window_decorations no
background_opacity 0.6

# Cursor
cursor #D6A15D
cursor_text_color #20251F
cursor_shape block
cursor_trail 10
cursor_trail_color #59664A
cursor_trail_decay 0.2 0.5

# Shell integration
shell_integration enabled

# ==========================================
# Background & Foreground
# ==========================================

background #20251F
foreground #D9D2C3

# ==========================================
# Selection
# ==========================================

selection_foreground #20251F
selection_background #D6C6A7

# ==========================================
# URL and search highlights
# ==========================================

url_color #D6A15D
active_border_color #78856A
inactive_border_color #393F35
bell_border_color #B86F43

# ==========================================
# Tabs
# ==========================================

active_tab_foreground #20251F
active_tab_background #A3A77B
inactive_tab_foreground #B6B09F
inactive_tab_background #30372D
tab_bar_background #20251F

# ==========================================
# 16-color palette
# ==========================================

# Black — dark forest and charcoal
color0  #20251F
color8  #596054

# Red — autumn leaves and rust
color1  #B85F45
color9  #D17A58

# Green — moss and alpine foliage
color2  #89966A
color10 #A3B184

# Yellow — golden autumn foliage
color3  #C49A57
color11 #DDB873

# Blue — distant mountain shadows
color4  #708A8B
color12 #91A9A5

# Magenta — muted burgundy
color5  #9B716D
color13 #BD9187

# Cyan — mist and weathered stone
color6  #829B96
color14 #A7BBB0

# White — warm limestone
color7  #C5BFAF
color15 #E8E0D0

# ==========================================
# Keyboard shortcuts
# ==========================================

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map ctrl+shift+w close_tab
map ctrl+t new_tab_with_cwd
map ctrl+shift+t new_tab

# ==========================================
# Nerd Font symbols
# ==========================================

symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono
